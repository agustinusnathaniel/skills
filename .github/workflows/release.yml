name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Create Version Pull Request
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          # Private package: publish only tags the release, nothing goes to npm.
          publish-script: pnpm changeset publish
          commit-message: "chore: version skills"
          pr-title: "chore: version skills"
          create-github-releases: true
